name: Form D Quarterly

on:
  schedule:
    - cron: "0 8 4-31 1,4,7,10 *"  # daily from 4th to end of Jan/Apr/Jul/Oct 08:00 UTC; flow self-skips once loaded
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r .github/workflows/requirements.txt

      - name: Run flow
        env:
          BIGQUERY_SERVICE_ACCOUNT_JSON: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT_JSON }}
        run: python orchestration/flows.py form_d_quarterly
