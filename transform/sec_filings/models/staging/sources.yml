version: 2

# Source freshness (project_plan P1 — silent-stall guard).
# Every source carries a loaded_at_field and warn/error thresholds matched to
# its cadence; `dbt source freshness` is called from orchestration/flows.py
# after each ingest, so a pipeline that no-ops green (like the ERA stall of
# 2026-05/06) turns the daily GH Actions run red instead of going unnoticed.
# Monthly/quarterly thresholds include headroom for SEC publication lag.
#
# dlt-loaded tables use _dlt_load_id (unix-epoch load time) — it only advances
# when rows actually land, which is exactly the stall signal we want.

sources:
  - name: state_adviser
    database: "{{ target.project }}"
    schema: "{{ var('state_raw_dataset') }}"
    # Daily snapshot feed (state-ria-daily, 06:00 UTC).
    config:
      loaded_at_field: "TIMESTAMP(SAFE.PARSE_DATE('%Y-%m-%d', snapshot_date))"
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 5, period: day}
    tables:
      - name: state_adviser_firms_raw
      - name: state_adviser_registrations_raw
      - name: state_adviser_master
        # Legacy pandas-era master, superseded by dbt-derived state
        # (state_ria_firm_history etc.); last written 2026-05-14 and
        # referenced by no model. Excluded from freshness; candidate to drop.
        config:
          freshness: null

  - name: era_adv
    database: "{{ target.project }}"
    schema: "{{ var('era_raw_dataset') }}"
    # Monthly SEC ERA archive; era-monthly flow loads it early the following
    # month (cron window opens on the 5th), so a healthy gap is ~30-35 days.
    config:
      loaded_at_field: "TIMESTAMP_SECONDS(CAST(CAST(_dlt_load_id AS FLOAT64) AS INT64))"
      freshness:
        warn_after: {count: 40, period: day}
        error_after: {count: 55, period: day}
    tables:
      - name: base
        description: >
          Raw Form ADV ERA filings from IARD/SEC EDGAR. One row per filing submission.
          Column names use the ERA XML numbering scheme which does NOT map 1-to-1 to
          printed Form ADV item numbers — see seeds/formadv_columns.csv for the field map.
        columns:
          - name: filing_id
            description: "Unique internal IARD/SEC identifier for this filing. System-generated."
            data_type: string
          - name: form_version
            description: "Version of Form ADV template used."
            data_type: string
          - name: date_submitted
            description: "Date the filing was submitted to IARD."
            data_type: date
          - name: execution_type
            description: "Type of submission: Initial / Annual Amendment / Other Amendment."
            data_type: string
          - name: execution_date
            description: "Date the form was signed by the signatory."
            data_type: date
          - name: signatory
            description: "Name of the person who certified/signed the filing."
            data_type: string
          - name: filing_month
            description: "YYYYMM period key derived from the filing submission date."
            data_type: string
          - name: _1_a
            description: "Form ADV Item 1.A — Full legal name of the investment adviser."
            data_type: string
          - name: _1_b1
            description: "Form ADV Item 1.B.1 — Other business/DBA names. Links to Schedule D Section 1.B."
            data_type: string
          - name: _1_d
            description: "Form ADV Item 1.D — SEC-assigned adviser number (e.g. 801-XXXXX)."
            data_type: string
          - name: _1_e1
            description: "Form ADV Item 1.E.1 — FINRA CRD registration number."
            data_type: string
          - name: _1_f1_street_1
            description: "Form ADV Item 1.F.1 — Principal office street address line 1."
            data_type: string
          - name: _1_f1_street_2
            description: "Form ADV Item 1.F.1 — Principal office street address line 2."
            data_type: string
          - name: _1_f1_city
            description: "Form ADV Item 1.F.1 — Principal office city."
            data_type: string
          - name: _1_f1_state
            description: "Form ADV Item 1.F.1 — Principal office state (two-letter code for US)."
            data_type: string
          - name: _1_f1_country
            description: "Form ADV Item 1.F.1 — Principal office country."
            data_type: string
          - name: _1_f1_postal
            description: "Form ADV Item 1.F.1 — Principal office postal/ZIP code."
            data_type: string
          - name: _1_f3
            description: "Form ADV Item 1.F.3 — Primary phone number."
            data_type: string
          - name: _2_b_assets
            description: "Form ADV Item 2.B — Regulatory AUM (USD) supporting the adviser's SEC registration eligibility."
            data_type: numeric
          - name: _3_a
            description: "Form ADV Item 3.A — Form of legal organization (e.g. LLC, corporation, partnership)."
            data_type: string
          - name: _3_b
            description: "Form ADV Item 3.B — Fiscal year end month (e.g. DECEMBER)."
            data_type: string
          - name: _3_c_state
            description: "Form ADV Item 3.C — State of incorporation/organization."
            data_type: string
          - name: _3_c_country
            description: "Form ADV Item 3.C — Country of incorporation/organization."
            data_type: string
      - name: filing_types
      - name: auditors
      - name: fund_admins
      - name: primary_brokers
      - name: marketers
      - name: custodians
      - name: form_d_num

  - name: form_d_filings
    database: "{{ target.project }}"
    schema: "{{ var('form_d_raw_dataset') }}"
    # Quarterly SEC bulk data set; form-d-quarterly loads it once published
    # (typically within weeks of quarter end), so a healthy gap is ~3 months.
    config:
      loaded_at_field: "TIMESTAMP_SECONDS(CAST(CAST(_dlt_load_id AS FLOAT64) AS INT64))"
      freshness:
        warn_after: {count: 105, period: day}
        error_after: {count: 135, period: day}
    tables:
      - name: form_d_submission
      - name: issuer
      - name: offering
      - name: related_persons

  - name: formd_crawler
    database: "{{ target.project }}"
    schema: "{{ var('form_d_crawler_dataset') }}"
    # Daily EDGAR index crawl; no filings on weekends/market holidays, so the
    # warn threshold tolerates a long weekend.
    config:
      loaded_at_field: "TIMESTAMP_SECONDS(CAST(CAST(_dlt_load_id AS FLOAT64) AS INT64))"
      freshness:
        warn_after: {count: 4, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: form_d_submission
      - name: issuer
      - name: offering
      - name: related_persons

  - name: gleif
    database: "{{ target.project }}"
    schema: "{{ var('gleif_raw_dataset') }}"
    # GLEIF LEI golden copy (ingestion/gleif/), refreshed monthly by the
    # gleif-monthly flow (cron window 2nd-8th, before era-monthly mints new
    # registry rows). Full replace each load; load_ts is stamped by the
    # ingest script (dlt's pandas/arrow path adds no _dlt_load_id).
    config:
      loaded_at_field: "load_ts"
      freshness:
        warn_after: {count: 40, period: day}
        error_after: {count: 55, period: day}
    tables:
      - name: lei_records
        description: "One row per LEI: legal name, addresses (ISO-2 countries), category, status, registration dates."
      - name: lei_names
        description: "One row per (lei, name, name_type): legal + other + transliterated name variants. Matching surface."

  - name: broker_dealer
    database: "{{ target.project }}"
    schema: "{{ var('broker_dealer_raw_dataset') }}"
    # BD master derivation stays in pandas (owner decision 2026-07), but
    # broker_dealer_master is consumed read-only by int_service_provider_links
    # since 2026-07-10: film_number (the zero-padded SEC 8- file number,
    # '8-1447' -> '00801447') validates reported prime-broker SEC numbers.
    # Month N's file lands ~day 5 of month N+1, so max healthy staleness vs
    # the last day of the covered month is ~35-40 days.
    tables:
      - name: broker_dealer_raw
        config:
          loaded_at_field: "TIMESTAMP(LAST_DAY(SAFE.PARSE_DATE('%y_%m', file_month)))"
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 60, period: day}
      - name: broker_dealer_master
        config:
          loaded_at_field: "TIMESTAMP(LAST_DAY(SAFE.PARSE_DATE('%y_%m', last_observed_month)))"
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 60, period: day}
