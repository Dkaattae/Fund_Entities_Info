version: 2

models:
  - name: adviser_auditor_status
    description: >
      One row per ERA adviser: PCAOB status of the auditors on its latest
      filing, AUM bucket, and the template-filing signal
      (same_auditor_same_aum_advisers = distinct advisers sharing the same
      auditor and identical reported AUM; large values indicate scam-farm
      template filings). Use case 5 / Auditor Watch page.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key']
    columns:
      - name: entity_key
        tests:
          - not_null
      - name: auditor_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['no_pcaob_auditor', 'mixed', 'registered_not_inspected', 'pcaob_inspected']

  - name: fund_audit_compliance
    description: >
      One row per audited private fund on its adviser's latest filing, with
      the Schedule D 7.B.1 Q23 audit state (report received? distributed?
      opinion?) and a custody-rule-style distribution deadline
      (adviser FYE + 120 days, 180 for fund of funds). is_overdue flags
      funds whose report is still outstanding/undistributed past that
      deadline with no amendment filed. Use case 7 / Late Audit Reports page.
      Terminated advisers (final report, nothing after) are excluded.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key', 'fund_id']
    columns:
      - name: entity_key
        tests:
          - not_null
      - name: fund_id
        tests:
          - not_null
      - name: audit_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['report_not_received', 'not_distributed', 'qualified_opinion', 'clean']

  - name: era_latest_filing
    description: >
      One row per ERA entity (CRD, fallback SEC adviser #) — most recent filing of any type.
      Includes amendment type flags and fiscal_year from era_filing_history,
      plus address/org fields joined from stg_era_base.
    columns:
      - name: entity_key
        tests:
          - unique
          - not_null

  - name: era_fund_closures
    description: >
      Fund closure events for ERA advisers. Three closure signals:
      fund_removed (a Form D file_number dropped from one annual snapshot to the next),
      aum_zeroed (AUM went from > 0 to 0 between consecutive annual snapshots), and
      adviser_terminated (adviser filed a final ERA report and went dark — every fund
      in their last snapshot is closed, dated to the final report). One row per
      (entity, fund/aum) closure event.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key', 'closure_signal', 'form_d_file_number']
    columns:
      - name: entity_key
        description: "Adviser CRD or SEC adviser number."
      - name: closure_signal
        description: "fund_removed | aum_zeroed | adviser_terminated"
      - name: filing_date_current
        description: "Date of the filing where the closure was first detected."
      - name: filing_date_prior
        description: "Date of the previous filing (last known healthy state)."
      - name: form_d_file_number
        description: "The specific Form D file number that was removed (fund_removed signal only)."
      - name: fund_name
        description: "Name of the removed fund from Form D data (fund_removed signal only)."
      - name: fund_continues_elsewhere
        description: >
          True when the fund was still reported under a different adviser at/after the
          closure date — the fund changed advisers rather than closing. Not a true
          closure; dashboards hide these by default.

  - name: era_filing_history
    description: All filings per ERA, with amendment flags and fiscal year end.
    columns:
      - name: filing_id
        tests:
          - not_null
      - name: entity_key
        tests:
          - not_null

  - name: era_state_registration_status
    description: Per-ERA flag on whether the firm is also a state-registered RIA.
    columns:
      - name: entity_key
        tests:
          - unique
          - not_null

  - name: service_provider_dim
    description: Canonical service-provider directory (auditor / fund admin / prime broker / marketer / custodian).
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['canonical_id', 'provider_type']
    columns:
      - name: canonical_id
        tests:
          - not_null
      - name: provider_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDITOR', 'FUND_ADMIN', 'PRIME_BROKER', 'MARKETER', 'CUSTODIAN']

  - name: service_provider_clients
    description: Per-provider client list for the latest year of ERA filings.
    columns:
      - name: canonical_id
        tests:
          - not_null

  - name: adviser_filing_compliance
    description: >
      One row per ERA adviser past its annual-amendment due date (FYE + 90
      days) with no filing for the current reporting year. Terminated
      advisers are excluded. Use case 6 / Missing ERA Filings page.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key']
    columns:
      - name: entity_key
        tests:
          - not_null
      - name: due_date
        tests:
          - not_null

  - name: service_provider_changes
    description: >
      One row per (adviser, provider_type): provider set on the two most
      recent fiscal-year snapshots and how it changed.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key', 'provider_type']
    columns:
      - name: entity_key
        tests:
          - not_null
      - name: change_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new_adviser', 'no_prior_data', 'swapped', 'added', 'dropped', 'unchanged']

  - name: service_provider_yoy
    description: Year-over-year adviser count per service provider and report year.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['canonical_id', 'provider_type', 'report_year']
    columns:
      - name: canonical_id
        tests:
          - not_null
      - name: report_year
        tests:
          - not_null

  - name: era_new_filers
    description: One row per initial IARD filing (SEC/state, RIA/ERA).
    columns:
      - name: filing_id
        tests:
          - unique
          - not_null
      - name: adviser_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SEC RIA', 'SEC ERA', 'State RIA', 'State ERA']

  - name: era_adviser_transitions
    description: >
      One row per adviser lifecycle transition event. An adviser can repeat
      a transition type (e.g. withdraw, return, withdraw again), so the
      grain includes the filing.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key', 'transition_type', 'filing_id']
    columns:
      - name: entity_key
        tests:
          - not_null
      - name: transition_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new_era', 'era_to_ria', 'new_ria', 'era_withdrawal', 'new_state_era', 'new_state_ria']
