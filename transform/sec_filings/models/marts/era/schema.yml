version: 2

models:
  - name: adviser_auditor_status
    description: >
      One row per ERA adviser: PCAOB status of the auditors on its latest
      filing, AUM bucket, and the template-filing signal
      (same_auditor_same_aum_advisers = distinct advisers sharing the same
      auditor and identical reported AUM; large values indicate scam-farm
      template filings). Use case 5 / Auditor Watch page.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key']
    columns:
      - name: entity_key
        tests:
          - not_null
      - name: auditor_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['no_pcaob_auditor', 'mixed', 'registered_not_inspected', 'pcaob_inspected']

  - name: era_latest_filing
    description: >
      One row per ERA entity (CRD, fallback SEC adviser #) — most recent filing of any type.
      Includes amendment type flags and fiscal_year from era_filing_history,
      plus address/org fields joined from stg_era_base.
    columns:
      - name: entity_key
        tests:
          - unique
          - not_null

  - name: era_fund_closures
    description: >
      Fund closure events for ERA advisers. Three closure signals:
      fund_removed (a Form D file_number dropped from one annual snapshot to the next),
      aum_zeroed (AUM went from > 0 to 0 between consecutive annual snapshots), and
      adviser_terminated (adviser filed a final ERA report and went dark — every fund
      in their last snapshot is closed, dated to the final report). One row per
      (entity, fund/aum) closure event.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['entity_key', 'closure_signal', 'form_d_file_number']
    columns:
      - name: entity_key
        description: "Adviser CRD or SEC adviser number."
      - name: closure_signal
        description: "fund_removed | aum_zeroed | adviser_terminated"
      - name: filing_date_current
        description: "Date of the filing where the closure was first detected."
      - name: filing_date_prior
        description: "Date of the previous filing (last known healthy state)."
      - name: form_d_file_number
        description: "The specific Form D file number that was removed (fund_removed signal only)."
      - name: fund_name
        description: "Name of the removed fund from Form D data (fund_removed signal only)."
      - name: fund_continues_elsewhere
        description: >
          True when the fund was still reported under a different adviser at/after the
          closure date — the fund changed advisers rather than closing. Not a true
          closure; dashboards hide these by default.

  - name: era_filing_history
    description: All filings per ERA, with amendment flags and fiscal year end.
    columns:
      - name: filing_id
        tests:
          - not_null
      - name: entity_key
        tests:
          - not_null

  - name: era_state_registration_status
    description: Per-ERA flag on whether the firm is also a state-registered RIA.
    columns:
      - name: entity_key
        tests:
          - unique
          - not_null

  - name: service_provider_dim
    description: Canonical service-provider directory (auditor / fund admin / prime broker / marketer / custodian).
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: ['canonical_id', 'provider_type']
    columns:
      - name: canonical_id
        tests:
          - not_null
      - name: provider_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDITOR', 'FUND_ADMIN', 'PRIME_BROKER', 'MARKETER', 'CUSTODIAN']

  - name: service_provider_clients
    description: Per-provider client list for the latest year of ERA filings.
    columns:
      - name: canonical_id
        tests:
          - not_null
