version: 2

models:
  - name: int_era_filings_by_year
    description: >
      One row per (entity_key, reporting_year). Reporting year is the derived fiscal_year
      from era_filing_history (priority: declared annual_amendment_fiscal_year, then FYE-derived,
      then submission year). Other-amendments inherit the reporting year of the most recent
      prior annual for that entity.
      Use this for year-over-year analysis, compliance views, and dashboards.
    columns:
      - name: entity_key
        description: "CRD number, or SEC adviser number where CRD is unavailable."
      - name: reporting_year
        description: "Fiscal year being reported on (e.g. 2024 for a Dec-FYE firm filing in early 2025)."
      - name: annual_filing_id
        description: "filing_id of the annual amendment for this reporting year."
      - name: annual_filing_date
        description: "date_submitted of the annual amendment."
      - name: latest_filing_id
        description: "filing_id of the most recent filing within this reporting year (annual or other-amendment)."
      - name: latest_filing_date
        description: "date_submitted of the latest filing within this reporting year."
      - name: is_superseded_by_amendment
        description: "True when an other-amendment was filed after the annual, making it the latest state for this year."

  - name: int_era_annual_snapshot
    description: >
      One row per (entity_key, reporting_year): the fully-resolved state for that
      fiscal year, built on top of int_era_filings_by_year. Content (AUM, fund list)
      comes from latest_filing_id so that other-amendments filed after the annual
      amendment are reflected before any downstream year-over-year comparisons.
      Downstream models (era_fund_closures) should use this instead of comparing
      raw consecutive filings.
    columns:
      - name: entity_key
        description: "CRD number, or SEC adviser number where CRD is unavailable."
      - name: reporting_year
        description: "Fiscal year being reported on."
      - name: latest_filing_id
        description: "filing_id of the most recent filing in this year (annual or amendment)."
      - name: latest_filing_date
        description: "date_submitted of the latest filing."
      - name: is_superseded_by_amendment
        description: "True when an other-amendment was filed after the annual."
      - name: assets_under_management
        description: "AUM as reported in latest_filing_id."
      - name: fund_file_numbers
        description: "Array of Form D file numbers disclosed in latest_filing_id. NULL if none."
      - name: fund_count
        description: "Count of Form D file numbers in fund_file_numbers."

  - name: int_service_provider_links
    description: >
      Long-format union of every service-provider mention across all ERA filings.
      Each row preserves the (filing_id, reference_id) link back to the ERA, plus
      a canonical_id that identifies the same provider across rows whose raw names disagree.
