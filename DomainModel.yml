domain_model: ADV_FormD_Regulatory_Intelligence
version: 0.3

description: >
  Stable regulatory domain model with identity resolution for service providers.
  Event-based and time-aware modeling. No business thresholds included.

entities:

  Adviser:
    primary_key: adviser_id
    attributes:
      - cik
      - crd
      - sec_adviser_number
      - legal_name
      - incorporation_date
    notes: >
      adviser_id resolves to firm_crd when available; falls back to
      sec_adviser_number (e.g. "802-XXXXXX") for advisers that have not
      received a CRD.
    time_dimensions:
      - existence_start_date
      - existence_end_date

  Fund:
    primary_key: fund_id
    attributes:
      - fund_name
      - domicile_country
      - formation_year         # Form D reports year only, not full date
    time_dimensions:
      - formation_year
      - termination_date

  Filing:
    primary_key: filing_id
    attributes:
      - filing_type            # ADV (initial / amendment / final), Form D (D / D/A)
      - filing_date
      - amendment_flag

  Offering:
    primary_key: offering_id   # Form D file_num (e.g. "021-XXXXXX")
    attributes:
      - first_sale_date
      - total_amount_sold
      - exemption_claims       # 3(c)(1), 3(c)(7), 506(b), 506(c)
    time_dimensions:
      - first_sale_date
      - closing_date

  ServiceProvider:
    primary_key: service_provider_id
    service_provider_id_format: "{PCAOB|SEC|LEI|NAME}:{value}"
    notes: >
      Canonical identifier resolution priority, applied per row in
      int_service_provider_links:
        1. PCAOB:<pcaob_number>   (auditors registered with PCAOB)
        2. SEC:<sec_number>       (brokers / custodians / marketers)
        3. LEI:<lei>              (custodians reporting an LEI)
        4. NAME:<farm_fingerprint(normalized_name|city|country)>
    attributes:
      - canonical_name
      - provider_type           # AUDITOR | FUND_ADMIN | PRIME_BROKER | MARKETER | CUSTODIAN
      - pcaob_number            # nullable
      - sec_number              # nullable
      - lei                     # nullable
      - normalization_status

  ServiceProviderAlias:
    materialization: derived    # implicit in int_service_provider_links; not persisted as its own table yet
    description: >
      Mapping from raw SEC text (raw_name) to canonical service_provider_id.
      Currently derived inline by int_service_provider_links — promote to a
      dedicated mart if alias-resolution audits become a requirement.
    attributes:
      - raw_name
      - service_provider_id
      - match_confidence
      - matching_method         # PCAOB | SEC_NUMBER | LEI | NAME_FINGERPRINT

  RegistrationStatus:
    primary_key: registration_event_id
    attributes:
      - registration_type       # SEC_ERA | SEC_RIA | STATE_RIA | STATE_ERA
      - jurisdiction            # 'SEC' for federal, 2-letter state code for state-level
      - effective_date
      - termination_date
    notes: >
      Jurisdiction is reported on Form ADV Item 2 / Schedule D (state
      registrations) and is the regulator_state value carried on the
      state-adviser feed.

relationships:

  - name: ADVISER_FILES_FILING
    from: Adviser
    to: Filing
    time_reference: filing_date

  - name: ADVISER_MANAGES_FUND
    from: Adviser
    to: Fund
    time_reference: formation_year

  - name: ADVISER_DISCLOSES_OFFERING
    from: Adviser
    to: Offering
    join_key: form_d_file_number   # Form ADV Schedule D Section 7.B
    notes: >
      Materialized in transform/sec_filings via the join
      era_adv.form_d_num.form_d_file_number ↔ form_d.form_d_submission.file_num.

  - name: FUND_HAS_OFFERING
    from: Fund
    to: Offering
    time_reference: first_sale_date

  - name: FUND_USES_SERVICE_PROVIDER
    from: Fund
    to: ServiceProvider
    attributes:
      - relationship_start_date
      - relationship_end_date
    time_reference: relationship_start_date

  - name: ADVISER_HAS_REGISTRATION_STATUS
    from: Adviser
    to: RegistrationStatus
    time_reference: effective_date

time_rules:

  - All stateful properties must be modeled as historical records.
  - Current state must be derivable from historical records.
  - Raw text identifiers must never be overwritten.
  - Canonical identity resolution must be separated from raw ingestion.
